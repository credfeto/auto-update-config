---
name: "Build and deploy to github pages"

on:
  push:
    branches:
      - main  # Set a branch to deploy
    paths:
      - packages.json
      - release.json
      - personal/repos.lst
      - funfair/repos.lst
      - personal/templates.json
      - funfair/templates.json
      - .github/workflows/deploy-to-github-pages.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    env:
      TARGET: ./public

    steps:
      - name: "Checkout Source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: "Remove gitignore"
        run: rm -f "$TARGET/.gitignore"

      - name: "Build"
        run: |
          mkdir "$TARGET/"
          cp packages.json "$TARGET/packages.config"
          cp release.json "$TARGET/personal-release.config"
          cp release.json "$TARGET/funfair-release.config"
          cp personal/repos.lst "$TARGET/personal-repos.config"
          cp funfair/repos.lst "$TARGET/funfair-repos.config"
          cp personal/templates.json "$TARGET/personal-templates.config"
          cp funfair/templates.json "$TARGET/funfair-templates.config"

      - name: "Deploy"
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "${{env.TARGET}}"
          cname: updates.markridgwell.com
